name: "Refrendo"
# El Marketplace corta la descripcion en 125 caracteres. Es la ficha del
# catalogo, no documentacion: tiene que caber y tiene que decir las dos mitades
# —abre el PR si pasan las puertas, revierte si no—, porque la segunda es la
# que diferencia esto de cualquier otro agente.
description: "Runs a coding agent that opens a pull request only if your own quality gates pass. Otherwise it reverts everything."
author: "Refrendo"

branding:
  icon: check-circle
  color: green

inputs:
  goal:
    description: "What the agent has to achieve."
    required: true
  acceptance:
    description: "Acceptance criteria, one per line."
    required: false
    default: ""
  constraints:
    description: "Hard constraints, one per line."
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API key."
    required: true
  github-token:
    description: "Token used to push the branch and open the pull request."
    required: false
    default: ${{ github.token }}
  model:
    description: "Model to use."
    required: false
    default: "claude-opus-5"
  effort:
    description: "low | medium | high | xhigh | max"
    required: false
    default: "high"
  max-cost:
    description: "Spend cap for the run, in USD. The run stops when reached."
    required: false
    default: "2.00"
  working-directory:
    description: "Repository directory."
    required: false
    default: "."
  branch-prefix:
    description: "Prefix for the branch that gets created."
    required: false
    default: "refrendo"
  base:
    description: "Base branch for the pull request."
    required: false
    default: ${{ github.event.repository.default_branch }}
  create-pr:
    description: "Push the branch and open the pull request when the run is verified."
    required: false
    default: "true"
  version:
    description: >-
      Refrendo version to use. Pinned by default so runs are reproducible; set
      "latest" to always follow the newest release.
    required: false
    default: "0.0.1"
  auto-approve:
    description: >-
      Pre-approve commands outside the allowlist. Leave it false unless you know
      exactly what the agent needs to run: destructive commands stay blocked,
      but this opens up everything else.
    required: false
    default: "false"

outputs:
  status:
    description: "verified | unverified | reverted | exhausted | failed"
    value: ${{ steps.refrendo.outputs.status }}
  verified:
    description: "true only if your project gates passed."
    value: ${{ steps.refrendo.outputs.verified }}
  cost-usd:
    description: "Actual cost of the run."
    value: ${{ steps.refrendo.outputs['cost-usd'] }}
  files-changed:
    description: "Number of files changed."
    value: ${{ steps.refrendo.outputs['files-changed'] }}
  branch:
    description: "Branch created, empty if nothing was committed."
    value: ${{ steps.refrendo.outputs.branch }}
  pr-url:
    description: "Pull request URL, empty if none was opened."
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Run the agent
      id: refrendo
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        REFRENDO_GOAL: ${{ inputs.goal }}
        REFRENDO_ACCEPTANCE: ${{ inputs.acceptance }}
        REFRENDO_CONSTRAINTS: ${{ inputs.constraints }}
      run: |
        set -euo pipefail

        # Los criterios llegan como texto multilínea; cada línea es un --accept.
        args=()
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--accept "$line")
        done <<< "$REFRENDO_ACCEPTANCE"
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--constraint "$line")
        done <<< "$REFRENDO_CONSTRAINTS"

        [ "${{ inputs.auto-approve }}" = "true" ] && args+=(--yes)

        # `ci` sale con 0 únicamente si el run queda verificado. No se usa
        # `continue-on-error`: si no está verificado, el job debe fallar.
        # Se instala el paquete publicado —el mismo artefacto que recibe
        # cualquier usuario— en vez de compilar el codigo del repositorio.
        #
        # Instalacion global y no `npx <paquete>@<version>`: npx tiene que
        # deducir que binario ejecutar a partir del nombre del paquete, y esa
        # deduccion fallo en Linux con "refrendo: not found" pese a que el
        # tarball trae el bin correcto. Instalar deja el ejecutable en el PATH
        # sin que nadie tenga que adivinar nada.
        npm install -g "refrendo@${{ inputs.version }}"

        refrendo ci "$REFRENDO_GOAL" \
          --model "${{ inputs.model }}" \
          --effort "${{ inputs.effort }}" \
          --max-cost "${{ inputs.max-cost }}" \
          --branch-prefix "${{ inputs.branch-prefix }}" \
          --report "$RUNNER_TEMP/refrendo-report.md" \
          "${args[@]}"

    # Aquí, y solo aquí, sale el código de la máquina. El agente nunca publica:
    # `git push` está en su denylist dura. La publicación es un paso visible del
    # workflow, con las credenciales del pipeline.
    - name: Push the branch and open the pull request
      id: pr
      if: ${{ steps.refrendo.outputs.verified == 'true' && steps.refrendo.outputs.branch != '' && inputs.create-pr == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        BRANCH="${{ steps.refrendo.outputs.branch }}"
        git push origin "$BRANCH"
        URL=$(gh pr create \
          --base "${{ inputs.base }}" \
          --head "$BRANCH" \
          --title "${{ inputs.goal }}" \
          --body-file "$RUNNER_TEMP/refrendo-report.md")
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "Pull request: $URL" >> "$GITHUB_STEP_SUMMARY"
